# The desktop tests that draw a whole window with the real wgpu renderer
# (each builds its egui_kittest harness with `.wgpu()`) run one at a time.
# egui_kittest gives the GPU a fixed 10 seconds per frame, and on the Windows
# runner (no GPU) two of these drawing at once can push a frame past that:
# `the_text_and_caption_inspector_paint` failed main twice, and
# `the_title_style_sections_switch_and_paint` once, with "PollError: The
# requested Wait timed out" while another drew beside it. A new test that
# draws with `.wgpu()` joins this list. Every other test still runs in
# parallel with them.
[test-groups]
wgpu-render = { max-threads = 1 }

[[profile.default.overrides]]
filter = '''
package(cutlass) & (
    test(=view::tests::the_assistant_panel_shows_a_mark_for_each_steps_state)
    | test(=view::tests::the_font_menu_is_searched_by_name)
    | test(=view::tests::the_inspector_tabs_stay_put_while_its_body_scrolls)
    | test(=view::tests::the_settings_rows_end_inside_the_dialog_on_every_page)
    | test(=view::tests::the_stickers_shelf_licenses_and_project_settings_paint)
    | test(=view::tests::the_text_and_caption_inspector_paint)
    | test(=view::tests::the_title_style_sections_switch_and_paint)
)
'''
test-group = 'wgpu-render'
