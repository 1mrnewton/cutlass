name: check

on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: GTK file dialogs, a software GPU and ALSA
        # mesa-vulkan-drivers brings lavapipe, a Vulkan device on the CPU, so
        # the wgpu tests run here instead of skipping. ALSA's null device
        # lets the preview queue write without sound hardware.
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev mesa-vulkan-drivers libasound2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Workspace lints are opted in
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          def lint_lines(text, header):
              start = text.find(header)
              if start < 0:
                  return []
              rest = text[start + len(header):]
              end = rest.find("\n[")
              body = rest if end < 0 else rest[:end]
              lines = []
              for line in body.splitlines():
                  line = line.strip()
                  if line and not line.startswith("#"):
                      lines.append(line)
              return lines

          root = Path(".")
          manifest = (root / "Cargo.toml").read_text()
          block = re.search(r"members = \[(.*?)\]", manifest, re.S).group(1)
          members = re.findall(r'"([^"]+)"', block)
          workspace_rust = lint_lines(manifest, "[workspace.lints.rust]")
          workspace_clippy = lint_lines(manifest, "[workspace.lints.clippy]")
          denied_rust = [
              'unsafe_code = "deny"' if line.startswith("unsafe_code") else line
              for line in workspace_rust
          ]
          missing = []
          allowed_unsafe = []
          for member in members:
              text = (root / member / "Cargo.toml").read_text()
              if 'unsafe_code = "allow"' in text:
                  allowed_unsafe.append(member)
              if "[lints]\nworkspace = true" in text:
                  continue
              # A platform crate copies the tables. Cargo rejects mixing
              # `workspace = true` with the one `unsafe_code` override.
              rust = lint_lines(text, "[lints.rust]")
              clippy = lint_lines(text, "[lints.clippy]")
              if (
                  member.startswith("crates/platform-")
                  and rust == denied_rust
                  and clippy == workspace_clippy
              ):
                  continue
              missing.append(member)
          if missing or allowed_unsafe:
              raise SystemExit(
                  "missing workspace lints: "
                  + ", ".join(missing)
                  + "\nunsafe_code set to allow: "
                  + ", ".join(allowed_unsafe)
              )
          PY
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        env:
          CUTLASS_REQUIRE_GPU: "1"
        run: cargo test --workspace --all-targets
      - name: Desktop smoke test
        run: |
          cargo build -p cutlass
          python3 scripts/smoke.py target/debug/cutlass
      - name: Public release logger
        run: |
          cargo clippy -p cutlass-logger --all-targets --features public-release -- -D warnings
          cargo test -p cutlass-logger --features public-release
          cargo check -p cutlass-ffi --features public-release
          cargo check -p cutlass --features public-release
      - name: Dependency policy
        uses: EmbarkStudios/cargo-deny-action@v2

  desktop:
    # The Linux job above covers the whole workspace. Here the desktop app
    # and the platform crate build and test on macOS and Windows, then the
    # built binary makes a project and edits it through `cutlass mcp`.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: cutlass-platform-apple
            binary: target/debug/cutlass
            python: python3
          - os: windows-latest
            platform: cutlass-platform-windows
            binary: target/debug/cutlass.exe
            python: python
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy -p cutlass -p ${{ matrix.platform }} --all-targets -- -D warnings
      - name: Test
        run: cargo test -p cutlass -p ${{ matrix.platform }} --all-targets
      - name: Smoke test
        run: |
          cargo build -p cutlass
          ${{ matrix.python }} scripts/smoke.py ${{ matrix.binary }}

  appimage:
    # The Linux release build as an AppImage, on the oldest supported
    # Ubuntu so its glibc runs on newer systems. The built AppImage runs the
    # same smoke test as the plain binary, then is kept as an artifact.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: GTK and ALSA headers
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libasound2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release -p cutlass
      - name: appimagetool 1.9.1
        run: |
          curl -sSL -o "$RUNNER_TEMP/appimagetool" https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          echo "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  $RUNNER_TEMP/appimagetool" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/appimagetool"
      - name: Package
        run: APPIMAGETOOL="$RUNNER_TEMP/appimagetool" python3 scripts/appimage.py target/release/cutlass dist/Cutlass-x86_64.AppImage
      - name: Smoke test the AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: python3 scripts/smoke.py dist/Cutlass-x86_64.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: Cutlass-x86_64.AppImage
          path: dist/Cutlass-x86_64.AppImage

  macos-bundle:
    # The macOS release build as Cutlass.app and a DMG, signed ad hoc until a
    # Developer ID is set up (CODESIGN_IDENTITY and NOTARY_PROFILE). The
    # binary inside the bundle runs the same smoke test, and the DMG is kept
    # as an artifact.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release -p cutlass
      - name: Bundle
        run: python3 scripts/macos_bundle.py target/release/cutlass dist
      - name: Smoke test the bundle
        run: python3 scripts/smoke.py dist/Cutlass.app/Contents/MacOS/cutlass
      - uses: actions/upload-artifact@v4
        with:
          name: Cutlass.dmg
          path: dist/Cutlass.dmg

  windows-installer:
    # The Windows release build as a per-user NSIS installer, unsigned until
    # a code signing certificate is set up (SIGNTOOL_CERT). The installer is
    # run silently, the installed binary runs the smoke test, and the
    # uninstaller removes it and its registry keys; the installer is kept.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release -p cutlass
      - name: NSIS
        shell: bash
        run: |
          command -v makensis || choco install nsis -y --no-progress
          echo "C:/Program Files (x86)/NSIS" >> "$GITHUB_PATH"
      - name: Package
        run: python scripts/windows_installer.py target/release/cutlass.exe dist/Cutlass-setup.exe
      - name: Install, smoke test and uninstall
        shell: pwsh
        run: |
          $dir = "$env:RUNNER_TEMP\CutlassInstall"
          Start-Process -Wait -FilePath dist\Cutlass-setup.exe -ArgumentList "/S", "/D=$dir"
          if (!(Test-Path "$dir\cutlass.exe")) { throw "nothing was installed" }
          if (!(Test-Path "HKCU:\Software\Classes\Directory\shell\Cutlass\command")) { throw "no Open in Cutlass" }
          python scripts/smoke.py "$dir\cutlass.exe"
          if ($LASTEXITCODE -ne 0) { throw "the smoke test failed" }
          Start-Process -Wait -FilePath "$dir\uninstall.exe" -ArgumentList "/S", "_?=$dir"
          if (Test-Path "$dir\cutlass.exe") { throw "the uninstaller left cutlass.exe" }
          if (Test-Path "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\Cutlass") { throw "the uninstaller left its key" }
      - uses: actions/upload-artifact@v4
        with:
          name: Cutlass-setup.exe
          path: dist/Cutlass-setup.exe
