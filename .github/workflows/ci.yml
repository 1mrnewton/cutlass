name: CI

on:
  pull_request:
    branches: [main]
  push:
    tags:
      - 'alpha-*'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: linux / fmt, clippy, docs, test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Docs
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps

      - name: Test
        run: cargo test --workspace

  macos:
    name: macos and ios / clippy, test
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: aarch64-apple-ios

      - uses: Swatinem/rust-cache@v2

      - name: Clippy (macOS)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Clippy (iOS)
        run: cargo clippy --workspace --target aarch64-apple-ios -- -D warnings

      - name: Test
        run: cargo test --workspace

  windows:
    name: windows / clippy, test
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

  android:
    name: android / clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy --workspace --target aarch64-linux-android -- -D warnings

  software-codecs:
    name: software codecs / build with no OS
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Clippy (wasm32)
        shell: bash
        run: |
          mapfile -t packages < <(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.manifest_path | contains("/crates/codecs/software/") or contains("/crates/project/") or contains("/crates/containers/") or contains("/crates/media/") or contains("/crates/color/")) | "--package=" + .name')
          cargo clippy --target wasm32-unknown-unknown "${packages[@]}" -- -D warnings

  deny:
    name: dependencies / licenses, bans, advisories
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: EmbarkStudios/cargo-deny-action@v2
