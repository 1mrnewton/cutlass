name: check

# A pull request runs the checks once; a push runs them only on main, so a
# push to a branch with an open pull request does not run them twice. Any
# other branch can be checked by hand from the Actions tab.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same pull request or branch cancels the run before it.
# Runs on main always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Only main saves build caches; pull requests restore main's. The cache
# store holds 10 GB, and each job's cache is 0.5 to 2 GB, so caches saved
# by every pull request evict one another and main's.
env:
  # Line tables keep panic backtraces readable while linking far less debug
  # information than a full debug build. Local builds keep full debug info.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: GTK file dialogs and ALSA
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libasound2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Workspace lints are opted in
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          def lint_lines(text, header):
              start = text.find(header)
              if start < 0:
                  return []
              rest = text[start + len(header):]
              end = rest.find("\n[")
              body = rest if end < 0 else rest[:end]
              lines = []
              for line in body.splitlines():
                  line = line.strip()
                  if line and not line.startswith("#"):
                      lines.append(line)
              return lines

          root = Path(".")
          manifest = (root / "Cargo.toml").read_text()
          block = re.search(r"members = \[(.*?)\]", manifest, re.S).group(1)
          members = re.findall(r'"([^"]+)"', block)
          workspace_rust = lint_lines(manifest, "[workspace.lints.rust]")
          workspace_clippy = lint_lines(manifest, "[workspace.lints.clippy]")
          denied_rust = [
              'unsafe_code = "deny"' if line.startswith("unsafe_code") else line
              for line in workspace_rust
          ]
          missing = []
          allowed_unsafe = []
          for member in members:
              text = (root / member / "Cargo.toml").read_text()
              if 'unsafe_code = "allow"' in text:
                  allowed_unsafe.append(member)
              if "[lints]\nworkspace = true" in text:
                  continue
              # A platform crate, and the H.264 and AV1 kernels, copy the tables.
              # Cargo rejects mixing `workspace = true` with the one
              # `unsafe_code` override.
              rust = lint_lines(text, "[lints.rust]")
              clippy = lint_lines(text, "[lints.clippy]")
              if (
                  (
                      member.startswith("crates/platform-")
                      or member == "crates/codecs/h264-kernels"
                      or member == "crates/simd"
                  )
                  and rust == denied_rust
                  and clippy == workspace_clippy
              ):
                  continue
              missing.append(member)
          if missing or allowed_unsafe:
              raise SystemExit(
                  "missing workspace lints: "
                  + ", ".join(missing)
                  + "\nunsafe_code set to allow: "
                  + ", ".join(allowed_unsafe)
              )
          PY
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Public release logger
        run: |
          cargo clippy -p cutlass-logger --all-targets --features public-release -- -D warnings
          cargo test -p cutlass-logger --features public-release
          cargo check -p cutlass-ffi --features public-release
          cargo check -p cutlass --features public-release
      - name: Dependency policy
        uses: EmbarkStudios/cargo-deny-action@v2

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: GTK file dialogs, a software GPU and ALSA
        # mesa-vulkan-drivers brings lavapipe, a Vulkan device on the CPU, so
        # the wgpu tests run here instead of skipping. ALSA's null device
        # lets the preview queue write without sound hardware.
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev mesa-vulkan-drivers libasound2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Test
        # Benches use their own harness, which nextest cannot list; clippy in
        # the lint job still builds them.
        env:
          CUTLASS_REQUIRE_GPU: "1"
        run: cargo nextest run --workspace --lib --bins --tests --no-fail-fast
      - name: Desktop smoke test
        run: |
          cargo build -p cutlass
          python3 scripts/smoke.py target/debug/cutlass

  bench:
    # Playback, scrub and export on a three-layer 1080p cut, against the
    # `ci` floors in tools/editor-bench/targets.json. Not part of `rust`:
    # a shared runner's speed varies, so a miss here is a signal to look,
    # not a merge gate. The numbers are in the job summary and artifact.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ffmpeg for the source movies, and a software GPU
        run: sudo apt-get update && sudo apt-get install -y ffmpeg mesa-vulkan-drivers libasound2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Bench
        run: |
          cargo run --release -p editor-bench -- --sides 1080 --seconds 2 --json bench.json --check ci | tee bench.txt
      - name: Summary
        if: always()
        run: |
          {
            echo '### Editor bench (three layers, 1080p, 2 s)'
            echo '```'
            cat bench.txt bench.json 2>/dev/null || echo 'no results'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: editor-bench
          path: bench.json
          if-no-files-found: ignore

  rust:
    # The check main's branch protection requires: it passes when the lint
    # and test jobs both pass.
    if: always()
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - name: Lint and test passed
        run: |
          test "${{ needs.lint.result }}" = success
          test "${{ needs.test.result }}" = success

  desktop:
    # The Linux job above covers the whole workspace. Here the desktop app
    # and the platform crate build and test on macOS and Windows, then the
    # built binary makes a project and edits it through `cutlass mcp`.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: cutlass-platform-apple
            binary: debug/cutlass
            python: python3
          - os: windows-latest
            platform: cutlass-platform-windows
            binary: debug/cutlass.exe
            python: python
    # Windows runs on the self-hosted runner labelled cutlass-windows when the
    # repository variable SELF_HOSTED_WINDOWS is 'true'; set it to anything
    # else while that machine is off and the job goes back to GitHub. A pull
    # request from a fork never runs on it, since anyone can open one.
    runs-on: >-
      ${{ matrix.os == 'windows-latest'
      && vars.SELF_HOSTED_WINDOWS == 'true'
      && (github.event_name != 'pull_request'
      || github.event.pull_request.head.repo.full_name == github.repository)
      && fromJSON('["self-hosted", "cutlass-windows"]')
      || matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Build folder kept between runs
        # A self-hosted runner keeps its build outside the checkout, which
        # checkout empties each run, so later runs rebuild only what changed.
        # Past 40 GB it starts again from empty, so the disk never fills.
        if: runner.environment == 'self-hosted'
        shell: bash
        run: |
          dir="${RUNNER_WORKSPACE}-target"
          if [ -d "$dir" ] && [ "$(du -sk "$dir" | cut -f1)" -gt 41943040 ]; then
            echo "Build folder is over 40 GB; emptying it."
            rm -rf "$dir"
          fi
          echo "CARGO_TARGET_DIR=$dir" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        if: runner.environment == 'github-hosted'
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Clippy
        run: cargo clippy -p cutlass -p ${{ matrix.platform }} --all-targets -- -D warnings
      - name: Test
        run: cargo nextest run -p cutlass -p ${{ matrix.platform }} --all-targets --no-fail-fast
      - name: Smoke test
        run: |
          cargo build -p cutlass
          ${{ matrix.python }} scripts/smoke.py ${{ env.CARGO_TARGET_DIR || 'target' }}/${{ matrix.binary }}

  android:
    # The phone app: the Rust crates it loads are linted for Android, the
    # library and its Kotlin bindings are built as apps/android/build-rust.sh
    # builds them (the committed bindings must match), and Gradle builds the
    # app and runs its unit tests. On main and on pull requests into main the
    # device tests then run on an API 30 x86_64 emulator, which needs KVM.
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: 30.0.16248370
    steps:
      - uses: actions/checkout@v4
      - name: ALSA headers for the host build the bindings generator reads
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: aarch64-linux-android, x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk@4.1.2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: NDK r30
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
      - name: Clippy for Android
        run: cargo clippy -p cutlass-platform-android -p cutlass-ffi -p cutlass-ffi-bindings --target aarch64-linux-android --no-deps -- -D warnings
      - name: Rust library and bindings
        run: |
          apps/android/build-rust.sh
          git diff --exit-code -- apps/android/app/src/main/java/uniffi
      - name: Build and unit test
        working-directory: apps/android
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug assembleDebugAndroidTest
      - name: KVM for the emulator
        if: github.event_name != 'pull_request' || github.base_ref == 'main'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Device tests on an emulator
        if: github.event_name != 'pull_request' || github.base_ref == 'main'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          # The editor draws with compute shaders, which need guest Vulkan.
          # The API 30 x86_64 image on emulator 37 offers the guest only
          # OpenGL ES 3.0 ("update the emulator to one that supports the
          # feature(s): Vulkan"), and the renderer refuses it.
          api-level: 34
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -no-boot-anim -camera-back none
          disable-animations: true
          working-directory: apps/android
          script: ./gradlew --no-daemon connectedDebugAndroidTest

  packaging-changes:
    # Release packaging is the slowest part of a run: each package is a PGO
    # build, three builds in one, and the macOS one alone takes about 27
    # minutes against 20 for the next job. It runs on main, by hand, and on
    # pull requests into main that change what packaging reads: its scripts
    # and installer files, the app's icons and manifest, the workspace
    # manifest, lockfile and toolchain, the H.264 crates and streams the PGO
    # build trains, and the workflows. Other pull requests skip it, and main
    # builds every package again once they merge. release.yml builds the
    # published packages.
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      # A pull request checks out its merge into the base; with its first
      # parent, the base, the diff is what the pull request changes.
      - uses: actions/checkout@v4
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        with:
          fetch-depth: 2
      - id: decide
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
        run: |
          if [ "$EVENT" != pull_request ]; then
            echo run=true >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$BASE" != main ]; then
            echo run=false >> "$GITHUB_OUTPUT"
            exit 0
          fi
          pattern='^(\.github/workflows/|installer/|apps/desktop/icons/|apps/desktop/Cargo\.toml$|Cargo\.(toml|lock)$|rust-toolchain\.toml$|scripts/(pgo|pgo_profile|macos_bundle|windows_installer|appimage|smoke)\.py$|tools/h264-pgo/|crates/codecs/h264(-kernels)?/)'
          matched=$(git diff --name-only HEAD^1 HEAD | grep -E "$pattern" || true)
          if [ -n "$matched" ]; then
            echo run=true >> "$GITHUB_OUTPUT"
            { echo '### Release packaging runs for these changes'; echo '```'; echo "$matched"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          else
            echo run=false >> "$GITHUB_OUTPUT"
            echo 'Release packaging is skipped: this pull request changes nothing it reads. Main builds it after the merge.' >> "$GITHUB_STEP_SUMMARY"
          fi

  appimage:
    # The Linux release build as an AppImage, on the oldest supported
    # Ubuntu so its glibc runs on newer systems. The built AppImage runs the
    # same smoke test as the plain binary, then is kept as an artifact.
    # It runs when packaging-changes says so.
    needs: packaging-changes
    if: needs.packaging-changes.outputs.run == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: GTK and ALSA headers
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libasound2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build
        # As release.yml builds: the H.264 codec optimised from a profile.
        run: python3 scripts/pgo.py -p cutlass
      - name: appimagetool 1.9.1
        run: |
          curl -sSL -o "$RUNNER_TEMP/appimagetool" https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          echo "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  $RUNNER_TEMP/appimagetool" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/appimagetool"
      - name: Package
        run: APPIMAGETOOL="$RUNNER_TEMP/appimagetool" python3 scripts/appimage.py target/release/cutlass dist/Cutlass-x86_64.AppImage
      - name: Smoke test the AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: python3 scripts/smoke.py dist/Cutlass-x86_64.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: Cutlass-x86_64.AppImage
          path: dist/Cutlass-x86_64.AppImage

  macos-bundle:
    # The macOS release build as Cutlass.app and a DMG, signed ad hoc until a
    # Developer ID is set up (CODESIGN_IDENTITY and NOTARY_PROFILE). The
    # binary inside the bundle runs the same smoke test, and the DMG is kept
    # as an artifact. It runs when packaging-changes says so.
    needs: packaging-changes
    if: needs.packaging-changes.outputs.run == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build
        # As release.yml builds: the H.264 codec optimised from a profile.
        run: python3 scripts/pgo.py -p cutlass
      - name: Bundle
        run: python3 scripts/macos_bundle.py target/release/cutlass dist
      - name: Smoke test the bundle
        run: python3 scripts/smoke.py dist/Cutlass.app/Contents/MacOS/cutlass
      - uses: actions/upload-artifact@v4
        with:
          name: Cutlass.dmg
          path: dist/Cutlass.dmg

  windows-installer:
    # The Windows release build as a per-user NSIS installer, unsigned until
    # a code signing certificate is set up (SIGNTOOL_CERT). The installer is
    # run silently, the installed binary runs the smoke test, and the
    # uninstaller removes it and its registry keys; the installer is kept.
    # It runs when packaging-changes says so.
    needs: packaging-changes
    if: needs.packaging-changes.outputs.run == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build
        # As release.yml builds: the H.264 codec optimised from a profile.
        run: python scripts/pgo.py -p cutlass
      - name: NSIS
        shell: bash
        run: |
          command -v makensis || choco install nsis -y --no-progress
          echo "C:/Program Files (x86)/NSIS" >> "$GITHUB_PATH"
      - name: Package
        run: python scripts/windows_installer.py target/release/cutlass.exe dist/Cutlass-setup.exe
      - name: Install, smoke test and uninstall
        shell: pwsh
        run: |
          $dir = "$env:RUNNER_TEMP\CutlassInstall"
          Start-Process -Wait -FilePath dist\Cutlass-setup.exe -ArgumentList "/S", "/D=$dir"
          if (!(Test-Path "$dir\cutlass.exe")) { throw "nothing was installed" }
          if (!(Test-Path "HKCU:\Software\Classes\Directory\shell\Cutlass\command")) { throw "no Open in Cutlass" }
          python scripts/smoke.py "$dir\cutlass.exe"
          if ($LASTEXITCODE -ne 0) { throw "the smoke test failed" }
          Start-Process -Wait -FilePath "$dir\uninstall.exe" -ArgumentList "/S", "_?=$dir"
          if (Test-Path "$dir\cutlass.exe") { throw "the uninstaller left cutlass.exe" }
          if (Test-Path "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\Cutlass") { throw "the uninstaller left its key" }
      - uses: actions/upload-artifact@v4
        with:
          name: Cutlass-setup.exe
          path: dist/Cutlass-setup.exe
