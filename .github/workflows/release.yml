name: release

# A tag `v<version>` builds the desktop packages and the Android APK,
# writes `<package>.sha256` beside each, and uploads them as a draft GitHub
# release. A check job
# downloads the draft's files and checks each against its checksum; the
# draft is then published by hand. The desktop's update check reads the
# published release from the API's `releases/latest`, which leaves drafts
# out. A tag with a `-` (such as v1.0.0-rc.1) is marked a pre-release,
# which the check also ignores. Tags come only from main, on a commit the
# `rust` check passed.
#
# The packages are built as in ci.yml, with `--features public-release`,
# through scripts/pgo.py: the H.264 codec is optimised from a profile of its
# own training run, which needs the toolchain's llvm-tools.
#
# macOS is signed with the Developer ID certificate and notarized when the
# repository has these secrets, and signed ad hoc without them:
#   MACOS_CERTIFICATE_P12       the certificate and its key, base64
#   MACOS_CERTIFICATE_PASSWORD  the .p12's password
#   APPSTORE_API_KEY_P8         an App Store Connect API key (.p8), base64
#   APPSTORE_API_KEY_ID         that key's id
#   APPSTORE_API_ISSUER_ID      the issuer id on the same page
# Windows stays unsigned until a signing service is set up (see
# docs/planned/release-ci.md and scripts/windows_installer.py).

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  # The packages every release must carry, each with a `<package>.sha256`
  # beside it; the update check asks for them by these names (crates/update
  # checks they are here). Cutlass.apk joins them when the Android upload
  # key is set, and gets a checksum the same way.
  PACKAGES: Cutlass.dmg Cutlass-x86_64-setup.exe Cutlass-aarch64-setup.exe Cutlass-x86_64.AppImage

jobs:
  version:
    # The tag names the version the packages carry, or the update check
    # would offer the same release again and again. A release is built only
    # from main, and only from a commit main's required `rust` check passed.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: The tag matches the workspace version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "the tag $GITHUB_REF_NAME is not v$version from Cargo.toml" >&2
            exit 1
          fi
      - name: The tag is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "the tag $GITHUB_REF_NAME points at $GITHUB_SHA, which is not on main" >&2
            exit 1
          fi
      - name: rust passed on the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          conclusions=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?check_name=rust" \
            --jq '[.check_runs[].conclusion] | join(" ")')
          case " $conclusions " in
            *" success "*) echo "rust passed on $GITHUB_SHA" ;;
            *)
              echo "rust has not passed on $GITHUB_SHA (runs: ${conclusions:-none}); tag a commit main's checks passed" >&2
              exit 1
              ;;
          esac

  macos:
    needs: version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools
      # The AV1 decoder builds guided by a profile of its own fixtures
      # (see scripts/pgo_profile.py): 3 to 5% fewer instructions on 4K.
      # scripts/pgo.py profiles the H.264 codec the same way and builds
      # with both profiles merged. Only here so far, where it was measured.
      - name: Profile the AV1 decoder
        run: python3 scripts/pgo_profile.py "$RUNNER_TEMP/av1.profdata"
      - name: Build
        run: PGO_MERGE="$RUNNER_TEMP/av1.profdata" python3 scripts/pgo.py -p cutlass --features public-release
      # Signing comes after the build, so no build script runs while the
      # certificate is in a keychain. Each secret is given only to the step
      # that needs it. Without the certificate the bundle is signed ad hoc;
      # without the API key it is signed but not notarized.
      - name: Which signing secrets are set
        id: signing
        env:
          CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          API_KEY: ${{ secrets.APPSTORE_API_KEY_P8 }}
        run: |
          echo "sign=$([ -n "$CERTIFICATE" ] && echo yes || echo no)" >> "$GITHUB_OUTPUT"
          echo "notarize=$([ -n "$CERTIFICATE" ] && [ -n "$API_KEY" ] && echo yes || echo no)" >> "$GITHUB_OUTPUT"
      - name: Developer ID certificate in a keychain of this run
        if: steps.signing.outputs.sign == 'yes'
        env:
          CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password=$(openssl rand -hex 24)
          echo "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$CERTIFICATE_PASSWORD" \
            -f pkcs12 -T /usr/bin/codesign
          rm "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          # The certificate's SHA-1 names it exactly, whatever else the
          # runner's keychains hold.
          identity=$(security find-identity -v -p codesigning "$keychain" \
            | awk '/"Developer ID Application: / { print $2; exit }')
          if [ -z "$identity" ]; then
            echo "the certificate holds no Developer ID Application identity" >&2
            exit 1
          fi
          echo "CODESIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
          echo "SIGNING_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
      - name: App Store Connect API key for notarization
        if: steps.signing.outputs.notarize == 'yes'
        env:
          API_KEY: ${{ secrets.APPSTORE_API_KEY_P8 }}
        run: |
          echo "$API_KEY" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          echo "NOTARY_KEY=$RUNNER_TEMP/notary.p8" >> "$GITHUB_ENV"
      - name: Bundle
        env:
          NOTARY_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.APPSTORE_API_ISSUER_ID }}
        run: python3 scripts/macos_bundle.py target/release/cutlass dist
      - name: Remove the signing keychain and key
        if: always()
        run: |
          if [ -n "${SIGNING_KEYCHAIN:-}" ]; then security delete-keychain "$SIGNING_KEYCHAIN"; fi
          rm -f "$RUNNER_TEMP/notary.p8" "$RUNNER_TEMP/certificate.p12"
      - name: Say how the DMG is signed
        run: |
          case "${{ steps.signing.outputs.sign }}/${{ steps.signing.outputs.notarize }}" in
            yes/yes) echo "macOS: Developer ID signed, notarized and stapled." ;;
            yes/no) echo "::warning::macOS: Developer ID signed but not notarized (no APPSTORE_API_KEY_P8); Gatekeeper will refuse it." ;;
            *) echo "::warning::macOS: signed ad hoc (no MACOS_CERTIFICATE_P12); Gatekeeper will refuse it." ;;
          esac
      - name: Smoke test the bundle
        run: python3 scripts/smoke.py dist/Cutlass.app/Contents/MacOS/cutlass
      - uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: dist/Cutlass.dmg
          if-no-files-found: error

  windows:
    # One installer per processor, each built, installed and smoke tested on
    # a machine of its own kind. The installer refuses a PC that cannot run
    # it; x64 Windows on Arm runs through emulation, slower than its own.
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            arch: x86_64
          - runner: windows-11-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    env:
      INSTALLER: Cutlass-${{ matrix.arch }}-setup.exe
    steps:
      - uses: actions/checkout@v4
      # The Arm image is not promised to carry Python, which the build and
      # packaging scripts run on.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools
      - name: Build
        run: python scripts/pgo.py -p cutlass --features public-release
      - name: NSIS
        shell: bash
        run: |
          command -v makensis || choco install nsis -y --no-progress
          echo "C:/Program Files (x86)/NSIS" >> "$GITHUB_PATH"
      # The script reads the processor from cutlass.exe and fails when it
      # is not the one the installer's name says.
      - name: Package
        run: python scripts/windows_installer.py target/release/cutlass.exe dist/${{ env.INSTALLER }}
      - name: Install and smoke test
        shell: pwsh
        run: |
          $dir = "$env:RUNNER_TEMP\CutlassInstall"
          Start-Process -Wait -FilePath "dist\$env:INSTALLER" -ArgumentList "/S", "/D=$dir"
          python scripts/smoke.py "$dir\cutlass.exe"
          if ($LASTEXITCODE -ne 0) { throw "the smoke test failed" }
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows-${{ matrix.arch }}
          path: dist/${{ env.INSTALLER }}
          if-no-files-found: error

  appimage:
    needs: version
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: GTK and ALSA headers
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libasound2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools
      - name: Build
        run: python3 scripts/pgo.py -p cutlass --features public-release
      - name: appimagetool 1.9.1
        run: |
          curl -sSL -o "$RUNNER_TEMP/appimagetool" https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          echo "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  $RUNNER_TEMP/appimagetool" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/appimagetool"
      - name: Package
        run: APPIMAGETOOL="$RUNNER_TEMP/appimagetool" python3 scripts/appimage.py target/release/cutlass dist/Cutlass-x86_64.AppImage
      - name: Smoke test the AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: python3 scripts/smoke.py dist/Cutlass-x86_64.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: release-appimage
          path: dist/Cutlass-x86_64.AppImage
          if-no-files-found: error

  android:
    # The phone app, built as ci.yml builds it but as a release: the Rust
    # library and bindings from apps/android/build-rust.sh, then Gradle's
    # release APK for the GitHub release and AAB for Google Play, signed
    # with the upload key when the repository has these secrets:
    #   ANDROID_KEYSTORE           the upload keystore, base64
    #   ANDROID_KEYSTORE_PASSWORD  its password
    #   ANDROID_KEY_ALIAS          the key's alias in it
    #   ANDROID_KEY_PASSWORD       the key's password
    # Without them nothing is published for Android: an unsigned APK
    # cannot be installed.
    needs: version
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: 30.0.16248370
    steps:
      - uses: actions/checkout@v4
      - name: ALSA headers for the host build the bindings generator reads
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, x86_64-linux-android
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk@4.1.2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true
      - name: NDK r30
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
      - name: Rust library and bindings
        run: |
          apps/android/build-rust.sh
          git diff --exit-code -- apps/android/app/src/main/java/uniffi
      - name: Is the upload key set
        id: signing
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
        run: echo "sign=$([ -n "$KEYSTORE" ] && echo yes || echo no)" >> "$GITHUB_OUTPUT"
      - name: Upload keystore
        if: steps.signing.outputs.sign == 'yes'
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
        run: |
          echo "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          echo "CUTLASS_ANDROID_KEYSTORE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
      - name: Build the release APK and AAB
        if: steps.signing.outputs.sign == 'yes'
        working-directory: apps/android
        env:
          CUTLASS_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          CUTLASS_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          CUTLASS_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease bundleRelease
      - name: Remove the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"
      - name: Check the signature and the version
        if: steps.signing.outputs.sign == 'yes'
        run: |
          mkdir dist
          cp apps/android/app/build/outputs/apk/release/app-release.apk dist/Cutlass.apk
          cp apps/android/app/build/outputs/bundle/release/app-release.aab "$RUNNER_TEMP/Cutlass.aab"
          tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$tools/apksigner" verify --print-certs dist/Cutlass.apk
          version=$("$tools/aapt2" dump badging dist/Cutlass.apk | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "the APK says $version, not ${GITHUB_REF_NAME#v}" >&2
            exit 1
          fi
      - name: Say how Android is published
        run: |
          if [ "${{ steps.signing.outputs.sign }}" = yes ]; then
            echo "Android: Cutlass.apk signed with the upload key; the AAB is kept for Google Play."
          else
            echo "::warning::Android: no ANDROID_KEYSTORE, so the release carries no APK."
          fi
      - uses: actions/upload-artifact@v4
        if: steps.signing.outputs.sign == 'yes'
        with:
          name: release-android
          path: dist/Cutlass.apk
          if-no-files-found: error
      # Not a release file: Play takes the AAB from its own upload.
      - uses: actions/upload-artifact@v4
        if: steps.signing.outputs.sign == 'yes'
        with:
          name: play-android
          path: ${{ runner.temp }}/Cutlass.aab
          if-no-files-found: error

  publish:
    # The packages go up as a draft, which the update check never sees.
    # Publishing it is done by hand, once the check below has passed.
    needs: [macos, windows, appimage, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: release-*
          merge-multiple: true
      - name: Checksums
        # `sha256sum` writes "<hex>  <name>"; the update check reads the
        # first token.
        working-directory: dist
        run: |
          for package in $PACKAGES; do
            test -s "$package"
          done
          for package in *; do
            sha256sum "$package" > "$package.sha256"
          done
          cat ./*.sha256
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=""
          case "$GITHUB_REF_NAME" in *-*) flags="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Cutlass ${GITHUB_REF_NAME#v}" \
            --generate-notes \
            --verify-tag \
            --draft \
            $flags

  check:
    # The draft's files, downloaded from the release as a user's update
    # would download them: each package is there, and matches its checksum.
    # A draft is visible only to a token that can write the repository.
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = true
          mkdir draft
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --dir draft
      - name: Every package matches its checksum
        working-directory: draft
        run: |
          for package in $PACKAGES; do
            test -s "$package"
            test -s "$package.sha256"
          done
          for sum in ./*.sha256; do
            sha256sum --check --strict "$sum"
          done
      - name: How to publish
        run: |
          {
            echo "The draft $GITHUB_REF_NAME passed its checks. Publish it to offer the update:"
            echo
            echo '```'
            echo "gh release edit $GITHUB_REF_NAME --repo $GITHUB_REPOSITORY --draft=false"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
