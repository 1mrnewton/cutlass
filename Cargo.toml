[workspace]
resolver = "2"
members = [
    "apps/desktop",
    "crates/agent",
    "crates/audio",
    "crates/captions",
    "crates/codec",
    "crates/codecs/aac",
    "crates/codecs/ac3",
    "crates/codecs/alac",
    "crates/codecs/av1",
    "crates/codecs/flac",
    "crates/codecs/gif",
    "crates/codecs/h264",
    "crates/codecs/hevc",
    "crates/codecs/jpeg",
    "crates/codecs/mjpeg",
    "crates/codecs/mp3",
    "crates/codecs/mpeg2",
    "crates/codecs/mpeg4",
    "crates/codecs/opus",
    "crates/codecs/pcm",
    "crates/codecs/png",
    "crates/codecs/prores",
    "crates/codecs/vorbis",
    "crates/codecs/vp8",
    "crates/codecs/vp9",
    "crates/codecs/webp",
    "crates/color",
    "crates/compositor",
    "crates/container",
    "crates/containers/adts",
    "crates/containers/aiff",
    "crates/containers/avi",
    "crates/containers/caf",
    "crates/containers/flac",
    "crates/containers/isobmff",
    "crates/containers/matroska",
    "crates/containers/mp3",
    "crates/containers/mpegts",
    "crates/containers/ogg",
    "crates/containers/riff",
    "crates/containers/still",
    "crates/decode",
    "crates/decode-platform",
    "crates/download",
    "crates/editor",
    "crates/effects",
    "crates/encode",
    "crates/encode-platform",
    "crates/engine",
    "crates/eval",
    "crates/export",
    "crates/ffi",
    "crates/font",
    "crates/generated",
    "crates/gpu",
    "crates/model",
    "crates/picture",
    "crates/playback",
    "crates/renderer-android",
    "crates/renderer-metal",
    "crates/renderer-software",
    "crates/renderer-windows",
    "crates/session",
    "crates/settings",
    "crates/storage",
    "crates/store",
    "crates/text",
    "crates/transcription",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"

# Every member opts in with `[lints] workspace = true`.
# `forbid` cannot be allowed later in a crate. A platform crate that calls an
# OS framework may override `unsafe_code` to `deny`, then allow it on that module.
[workspace.lints.rust]
unsafe_code = "forbid"
future_incompatible = { level = "deny", priority = -1 }
nonstandard_style = { level = "deny", priority = -1 }
rust_2018_idioms = { level = "deny", priority = -1 }
trivial_casts = "deny"
trivial_numeric_casts = "deny"
unused_lifetimes = "deny"
unused_qualifications = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
wildcard_imports = "deny"
exit = "deny"
mem_forget = "deny"
get_unwrap = "deny"
