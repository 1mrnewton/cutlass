    "crates/agent",
    "crates/audio",
    "crates/captions",
    "crates/codec",
    "crates/codecs/aac",
    "crates/codecs/ac3",
    "crates/codecs/alac",
    "crates/codecs/av1",
    "crates/codecs/flac",
    "crates/codecs/gif",
    "crates/codecs/h264",
    "crates/codecs/hevc",
    "crates/codecs/jpeg",
    "crates/codecs/mjpeg",
    "crates/codecs/mp3",
    "crates/codecs/mpeg2",
    "crates/codecs/mpeg4",
    "crates/codecs/opus",
    "crates/codecs/pcm",
    "crates/codecs/png",
    "crates/codecs/prores",
    "crates/codecs/vorbis",
    "crates/codecs/vp8",
    "crates/codecs/vp9",
    "crates/codecs/webp",
    "crates/color",
    "crates/compositor",
    "crates/container",
    "crates/containers/adts",
    "crates/containers/aiff",
    "crates/containers/avi",
    "crates/containers/caf",
    "crates/containers/flac",
    "crates/containers/isobmff",
    "crates/containers/matroska",
    "crates/containers/mp3",
    "crates/containers/mpegts",
    "crates/containers/ogg",
    "crates/containers/riff",
    "crates/containers/still",
    "crates/decode",
    "crates/download",
    "crates/editor",
    "crates/effects",
    "crates/encode",
    "crates/engine",
    "crates/eval",
    "crates/export",
    "crates/ffi",
    "crates/ffi-bindings",
    "crates/font",
    "crates/generated",
    "crates/gpu",
    "crates/icons",
    "crates/licenses",
    "crates/logger",
    "crates/lottie",
    "crates/model",
    "crates/picture",
    "crates/platform-android",
    "crates/platform-apple",
    "crates/platform-linux",
    "crates/platform-windows",
    "crates/playback",
    "crates/pool",
    "crates/probe",
    "crates/render",
    "crates/renderer-software",
    "crates/session",
    "crates/settings",
    "crates/stickers",
    "crates/storage",
    "crates/store",
    "crates/text",
    "crates/transcription",
    "crates/update",
    "crates/vision",
    "tools/icongen",
    "tools/licenses",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"

# Every member opts in with `[lints] workspace = true`.
# Cargo cannot mix that with one overridden lint. `forbid` cannot be allowed
# later in a crate. A platform crate that calls an OS framework copies these
# tables and sets `unsafe_code` to `deny`, then allows it on that module.
[workspace.lints.rust]
unsafe_code = "forbid"
future_incompatible = { level = "deny", priority = -1 }
nonstandard_style = { level = "deny", priority = -1 }
rust_2018_idioms = { level = "deny", priority = -1 }
trivial_casts = "deny"
trivial_numeric_casts = "deny"
unused_lifetimes = "deny"
unused_qualifications = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
wildcard_imports = "deny"
exit = "deny"
mem_forget = "deny"
get_unwrap = "deny"

# Playback mixes sound in real time, even in a debug build. Unoptimised,
# two AAC clips take longer to decode and resample than they last, and the
# device plays gaps. The sound decoders and the mixer build optimised.
[profile.dev.package.cutlass-audio]
opt-level = 3
[profile.dev.package.cutlass-aac]
opt-level = 3
[profile.dev.package.cutlass-ac3]
opt-level = 3
[profile.dev.package.cutlass-alac]
opt-level = 3
[profile.dev.package.cutlass-flac]
opt-level = 3
[profile.dev.package.cutlass-mp3]
opt-level = 3
[profile.dev.package.cutlass-opus]
opt-level = 3
[profile.dev.package.cutlass-pcm]
opt-level = 3
[profile.dev.package.cutlass-vorbis]
opt-level = 3

# A debug build still plays and exports VP8 at 1080p, and the export test
# encodes 960x480 through the desktop shell; unoptimised, that test takes
# 90 s on an M5 and risks the CI runner's job limit. Overflow checks and
# debug assertions stay on.
[profile.dev.package.cutlass-vp8]
opt-level = 3

# Off Apple, H.264 export runs the Rust encoder. Unoptimised, the desktop
# export test's 480p encode sometimes passes its 60 s limit on a CI runner.
# Overflow checks and debug assertions stay on.
[profile.dev.package.cutlass-h264]
opt-level = 3

# The WebP and ProRes tests round-trip whole pictures through libwebp,
# FFmpeg and the platform readers. Unoptimised, the WebP lossless
# round-trip ran past 28 minutes on an M5 without finishing; optimised it
# takes about a minute. Overflow checks and debug assertions stay on.
[profile.dev.package.cutlass-webp]
opt-level = 3
[profile.dev.package.cutlass-prores]
opt-level = 3

# The AV1 and HEVC tests decode whole real files, up to 2160p, and compare
# every frame with dav1d and FFmpeg. Unoptimised, two AV1 file checks ran
# past 13 minutes without finishing. Overflow checks and debug assertions
# stay on.
[profile.dev.package.cutlass-av1]
opt-level = 3
[profile.dev.package.cutlass-hevc]
opt-level = 3

# The vision tests run MobileSAM on the CPU. Unoptimised, one frame takes
# minutes; burn's CPU backend and its matrix kernels build optimised.
[profile.dev.package.burn-flex]
opt-level = 3
[profile.dev.package.burn-backend]
opt-level = 3
[profile.dev.package.burn-std]
opt-level = 3
[profile.dev.package.gemm]
opt-level = 3
[profile.dev.package.gemm-common]
opt-level = 3
[profile.dev.package.gemm-f32]
opt-level = 3
