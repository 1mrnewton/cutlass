[package]
name = "cutlass-desktop"
version.workspace = true
edition.workspace = true
rust-version = "1.95"
license.workspace = true
repository.workspace = true
publish = false
description = "The desktop editor."

[[bin]]
name = "cutlass"
path = "src/main.rs"

[dependencies]
cutlass-compose.workspace = true
cutlass-core.workspace = true
cutlass-media.workspace = true
cutlass-project.workspace = true
eframe.workspace = true
rfd.workspace = true
uuid.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
rfd = { workspace = true, features = ["xdg-portal"] }

[target.'cfg(target_vendor = "apple")'.dependencies]
cutlass-audiotoolbox.workspace = true
cutlass-color.workspace = true
cutlass-output.workspace = true
cutlass-playback.workspace = true
cutlass-videotoolbox.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "NSButton",
    "NSControl",
    "NSResponder",
    "NSView",
    "NSWindow",
    "std",
] }
raw-window-handle = "0.6.2"

[dev-dependencies]
cutlass-mp4.workspace = true

[target.'cfg(target_vendor = "apple")'.dev-dependencies]
cutlass-test-fixtures.workspace = true

[lints]
workspace = true
