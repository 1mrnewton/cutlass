[package]
name = "cutlass-desktop"
version.workspace = true
edition.workspace = true
rust-version = "1.95"
license.workspace = true
repository.workspace = true
publish = false
description = "The desktop editor."

[[bin]]
name = "cutlass"
path = "src/main.rs"

[dependencies]
cutlass-project.workspace = true
eframe.workspace = true
uuid.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "NSButton",
    "NSControl",
    "NSResponder",
    "NSView",
    "NSWindow",
    "std",
] }
raw-window-handle = "0.6.2"

[dev-dependencies]
cutlass-core.workspace = true

[lints]
workspace = true
