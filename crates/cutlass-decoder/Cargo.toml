[package]
name = "cutlass-decoder"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Cutlass video demux + decode"

[features]
# FFmpeg demux/decode + the audio DSP and stills paths built on it. Default on
# for desktop; turned off for platforms that can't link libav* (iOS/Android),
# which fall back to the platform-native AVFoundation/MediaCodec backends.
# The audio-DSP crates (time-stretch/denoise/FFT) only feed the FFmpeg `audio`
# module, so they ride this feature too — keeping their C++/bindgen builds out
# of the mobile graph entirely.
default = ["ffmpeg"]
ffmpeg = [
    "dep:ffmpeg-next",
    "dep:signalsmith-stretch",
    "dep:nnnoiseless",
    "dep:rustfft",
]

[dependencies]
cutlass-core = { path = "../cutlass-core", default-features = false }
ffmpeg-next = { workspace = true, optional = true }
signalsmith-stretch = { workspace = true, optional = true }
nnnoiseless = { workspace = true, optional = true }
rustfft = { workspace = true, optional = true }
thiserror.workspace = true
tracing.workspace = true

# Apple backend (FFmpeg-free): AVFoundation reader (demux + VideoToolbox decode)
# producing IOSurface-backed CVPixelBuffers. objc2 framework crates are pinned
# to the same 0.3.2 / objc2 0.6 line the compositor's Metal interop uses so the
# CVPixelBuffer / CoreMedia types unify across the decode->compositor handoff.
[target.'cfg(target_vendor = "apple")'.dependencies]
objc2 = "0.6.4"
objc2-foundation = "0.3.2"
# `objc2-core-media` / `objc2-core-video` features turn on the AVFoundation
# methods that return CMSampleBuffer / CVImageBuffer (e.g. copyNextSampleBuffer),
# which aren't in the default set.
objc2-av-foundation = { version = "0.3.2", features = [
    "objc2-core-media",
    "objc2-core-video",
] }
objc2-core-media = "0.3.2"
objc2-core-video = "0.3.2"
objc2-core-foundation = "0.3.2"

# Android backend (FFmpeg-free): AMediaExtractor (demux) + AMediaCodec
# (MediaCodec hardware decode) producing CPU YUV planes. `ndk` wraps the codec /
# format; `ndk-sys` exposes AMediaExtractor (not in the safe crate). Pinned to
# the matched ndk 0.9 / ndk-sys 0.6 line so the AMediaFormat handle the extractor
# vends unifies with the codec's `MediaFormat::from_ptr`.
[target.'cfg(target_os = "android")'.dependencies]
ndk = { version = "0.9", features = ["media", "api-level-26"] }
ndk-sys = "0.6"

# Windows backend (FFmpeg-free): Media Foundation Source Reader (demux + decode)
# producing system-memory NV12 buffers on the CPU path. The `windows` crate gives
# COM ergonomics (RAII release, `.cast()`, `Result<HRESULT>`) that raw
# `windows-sys` lacks, which matters for the COM-heavy MF surface.
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
] }

[dev-dependencies]
criterion.workspace = true
tempfile = "3"

[[bench]]
name = "decode"
harness = false
