[package]
name = "cutlass-encoder"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Cutlass video encode + mux"

[features]
# FFmpeg H.264 encode + mux (export, proxy). Default on for desktop; off on
# platforms that can't link libav* (iOS/Android), which use the native
# AVFoundation/MediaCodec encoder via `open_encoder`.
default = ["ffmpeg"]
ffmpeg = ["dep:ffmpeg-next", "cutlass-decoder/ffmpeg"]

[dependencies]
cutlass-core = { path = "../cutlass-core", default-features = false }
cutlass-decoder = { path = "../cutlass-decoder", default-features = false }
ffmpeg-next = { workspace = true, optional = true }
thiserror.workspace = true
tracing.workspace = true

# Apple backend (FFmpeg-free): AVAssetWriter (VideoToolbox H.264 encode + mp4
# mux). objc2 framework crates are pinned to the same line the decoder /
# compositor use so the CVPixelBuffer / CoreMedia types unify across the encode
# handoff.
[target.'cfg(target_vendor = "apple")'.dependencies]
objc2 = "0.6.4"
objc2-foundation = "0.3.2"
objc2-av-foundation = { version = "0.3.2", features = [
    "objc2-core-media",
    "objc2-core-video",
] }
objc2-core-media = "0.3.2"
objc2-core-video = "0.3.2"
objc2-core-foundation = "0.3.2"

[dev-dependencies]
cutlass-decoder = { path = "../cutlass-decoder" }
