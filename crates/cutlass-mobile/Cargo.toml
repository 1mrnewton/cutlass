[package]
name = "cutlass-mobile"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Mobile FFI bridge for Cutlass: renders frames for the iOS/Android test apps (C ABI + JNI)."

# `staticlib` for the iOS app (linked into the binary), `cdylib` (.so) for the
# Android app (loaded at runtime via System.loadLibrary), `rlib` so host
# integration tests can link the crate. Each platform consumes the one it needs.
[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Force the engine's platform-native (FFmpeg-free) decode path on a desktop host
# so the FFI can be exercised end-to-end off-device. On iOS/Android the engine
# selects native decode automatically (see cutlass-engine/build.rs).
native-decode = ["cutlass-engine/native-decode"]

[dependencies]
cutlass-core = { path = "../cutlass-core", default-features = false }
cutlass-compositor = { path = "../cutlass-compositor" }
cutlass-engine = { path = "../cutlass-engine" }
cutlass-models = { path = "../cutlass-models" }
# Pulls in the command enums *with* serde derives (feature unification turns the
# `serde` feature on for the single cutlass-commands compilation), so the JSON
# command/state bridge can deserialize edits the same way the AI agent will.
cutlass-commands = { path = "../cutlass-commands", features = ["serde"] }
# FFmpeg-free here so mobile (iOS/Android) doesn't force libav* back on through
# feature unification; on desktop the engine still pulls the FFmpeg probe in.
cutlass-probe = { path = "../cutlass-probe", default-features = false }
serde = { workspace = true }
serde_json.workspace = true
log = "0.4"

# Android: JNI entry points the Kotlin app calls. (iOS uses the plain C ABI.)
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
android_logger = "0.14"

[dev-dependencies]
# Round-trip the FFI hermetically: synthesize an mp4 with the native encoder,
# then render its first frame back through the bridge.
cutlass-encoder = { path = "../cutlass-encoder" }
