[package]
name = "cutlass-probe"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Cutlass media file probing (container, codec, stream metadata)"

[features]
# FFmpeg (ffprobe-style) demux probing. Default on for desktop; off on
# platforms that can't link libav* (iOS/Android), which probe via the native
# decoder (`cutlass-decoder`'s AVFoundation/MediaCodec backend).
default = ["ffmpeg"]
ffmpeg = ["dep:ffmpeg-next"]

[dependencies]
cutlass-models = { path = "../cutlass-models" }
# Native probe fallback (FFmpeg-free): reads metadata from the platform decoder.
# `default-features = false` so this never pulls FFmpeg in itself; the workspace
# unifies the FFmpeg feature on where desktop crates ask for it.
cutlass-decoder = { path = "../cutlass-decoder", default-features = false }
ffmpeg-next = { workspace = true, optional = true }
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
cutlass-decoder = { path = "../cutlass-decoder" }
