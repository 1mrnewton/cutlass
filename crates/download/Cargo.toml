[package]
name = "cutlass-download"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
description = "One URL to a partial file, in pieces over several connections."

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.10.9"
ureq = { version = "=3.5.0", default-features = false, features = ["rustls"], optional = true }

[features]
# The HTTP and HTTPS transport (`Http`), which brings rustls and ring.
http = ["dep:ureq"]

[dev-dependencies]
# The loopback tests use the real transport.
cutlass-download = { path = ".", features = ["http"] }
serde_json = "1.0.154"

[lints]
workspace = true
