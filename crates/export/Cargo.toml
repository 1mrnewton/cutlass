[package]
name = "cutlass-export"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
description = "Encode a range and mux it."

[dependencies]
cutlass-eval = { path = "../eval", version = "0.1.0" }
cutlass-encode = { path = "../encode", version = "0.1.0" }
cutlass-container = { path = "../container", version = "0.1.0" }
cutlass-codec = { path = "../codec", version = "0.1.0" }
cutlass-model = { path = "../model", version = "0.1.0" }
cutlass-gpu = { path = "../gpu", version = "0.1.0" }
cutlass-render = { path = "../render", version = "0.1.0" }
cutlass-isobmff = { path = "../containers/isobmff", version = "0.1.0" }
cutlass-mp3-container = { path = "../containers/mp3", version = "0.1.0" }
cutlass-riff = { path = "../containers/riff", version = "0.1.0" }
cutlass-caf = { path = "../containers/caf", version = "0.1.0" }
cutlass-flac-container = { path = "../containers/flac", version = "0.1.0" }
cutlass-ogg = { path = "../containers/ogg", version = "0.1.0" }
cutlass-still = { path = "../containers/still", version = "0.1.0" }
cutlass-renderer-software = { path = "../renderer-software", version = "0.1.0" }
serde_json = "1.0.154"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }

[dev-dependencies]
cutlass-aac = { path = "../codecs/aac", version = "0.1.0" }
cutlass-ac3 = { path = "../codecs/ac3", version = "0.1.0" }
cutlass-alac = { path = "../codecs/alac", version = "0.1.0" }
cutlass-flac = { path = "../codecs/flac", version = "0.1.0" }
cutlass-gif = { path = "../codecs/gif", version = "0.1.0" }
cutlass-h264 = { path = "../codecs/h264", version = "0.1.0" }
cutlass-engine = { path = "../engine", version = "0.1.0" }
cutlass-picture = { path = "../picture", version = "0.1.0" }
cutlass-mp3 = { path = "../codecs/mp3", version = "0.1.0" }
cutlass-mpeg4 = { path = "../codecs/mpeg4", version = "0.1.0" }
cutlass-opus = { path = "../codecs/opus", version = "0.1.0" }
cutlass-vorbis = { path = "../codecs/vorbis", version = "0.1.0" }
cutlass-webp = { path = "../codecs/webp", version = "0.1.0" }
cutlass-decode = { path = "../decode", version = "0.1.0" }
cutlass-pcm = { path = "../codecs/pcm", version = "0.1.0" }
cutlass-playback = { path = "../playback", version = "0.1.0" }
cutlass-session = { path = "../session", version = "0.1.0" }

[lints]
workspace = true
