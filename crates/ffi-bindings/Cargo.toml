[package]
name = "cutlass-ffi-bindings"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
description = "The Swift and Kotlin bindings over ffi."

[lib]
name = "cutlass_ffi_bindings"
# The phones link the static library. The dynamic one is read by
# `tools/uniffi-bindgen` on the host to write the Swift and Kotlin files.
crate-type = ["lib", "staticlib", "cdylib"]

[dependencies]
cutlass-ffi = { path = "../ffi", version = "0.1.0" }
uniffi = { version = "0.32.2", default-features = false }

[lints]
workspace = true
