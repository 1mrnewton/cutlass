[package]
name = "cutlass-simd"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
description = "Vector kernels for the Rust codecs."

# Cargo cannot mix `workspace = true` with one overridden lint, and `forbid`
# cannot be allowed at a call. These are the workspace lints with
# `unsafe_code` lowered to `deny`, so the one call that enters a kernel can
# allow it. Nothing else in the workspace may write `unsafe` for a kernel.
[lints.rust]
unsafe_code = "deny"
future_incompatible = { level = "deny", priority = -1 }
nonstandard_style = { level = "deny", priority = -1 }
rust_2018_idioms = { level = "deny", priority = -1 }
trivial_casts = "deny"
trivial_numeric_casts = "deny"
unused_lifetimes = "deny"
unused_qualifications = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
wildcard_imports = "deny"
exit = "deny"
mem_forget = "deny"
get_unwrap = "deny"
