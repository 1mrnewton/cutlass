[package]
name = "cutlass-vision"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
description = "On-device image models on burn: click-to-select with MobileSAM, Enhance quality with Real-ESRGAN's compact model, and Reduce image noise with FastDVDnet."

[dependencies]
cutlass-effects = { path = "../effects", version = "0.1.0" }
cutlass-encode = { path = "../encode", version = "0.1.0" }
cutlass-eval = { path = "../eval", version = "0.1.0" }
cutlass-export = { path = "../export", version = "0.1.0" }
cutlass-store = { path = "../store", version = "0.1.0" }
cutlass-model = { path = "../model", version = "0.1.0" }
cutlass-session = { path = "../session", version = "0.1.0" }
# The CPU backend everywhere. `fusion` and `autotune` only change GPU work.
burn = { version = "=0.22.1", default-features = false, features = ["std", "flex", "fusion", "autotune"] }
burn-store = "=0.22.1"
image = { version = "0.25.10", default-features = false }

# The Mac is the one GPU path proven to give correct masks. `persistence`
# keeps compiled kernels on disk; it builds C through turso (see deny.toml).
[target.'cfg(target_os = "macos")'.dependencies]
burn = { version = "=0.22.1", default-features = false, features = ["metal", "persistence"] }
cubecl-environment = { version = "=0.11.3", features = ["persistence"] }
cubecl-runtime = "=0.11.3"

[dev-dependencies]
safetensors = "0.8.0"
cutlass-codec = { path = "../codec", version = "0.1.0" }
cutlass-container = { path = "../container", version = "0.1.0" }
cutlass-engine = { path = "../engine", version = "0.1.0" }
cutlass-h264 = { path = "../codecs/h264", version = "0.1.0" }
cutlass-isobmff = { path = "../containers/isobmff", version = "0.1.0" }
cutlass-picture = { path = "../picture", version = "0.1.0" }

[lints]
workspace = true
