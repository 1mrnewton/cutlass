[graph]
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
]
all-features = true

[advisories]
unmaintained = "all"
unsound = "all"
ignore = [
    { id = "RUSTSEC-2024-0436", reason = "gemm and tokenizers still depend on paste, and the advisory has no upgrade." },
    { id = "RUSTSEC-2026-0367", reason = "candle-core reads and writes zip entries for npy. It does not call extract, which is the vulnerable API. Transcription loads safetensors." },
    { id = "RUSTSEC-2026-0368", reason = "candle-core reads and writes zip entries for npy. It does not call extract, which is the vulnerable API. Transcription loads safetensors." },
    { id = "RUSTSEC-2026-0369", reason = "candle-core reads and writes zip entries for npy. It does not call extract, which is the vulnerable API. Transcription loads safetensors." },
]

[licenses]
confidence-threshold = 0.93
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = [
    "cc",
    "cmake",
    "bindgen",
    "nasm-rs",
    "ffmpeg-sys",
    "ffmpeg-sys-next",
    "ffmpeg-next",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = ["https://github.com/huggingface/candle"]
required-git-spec = "rev"
