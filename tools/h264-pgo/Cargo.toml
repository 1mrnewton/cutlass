# Runs the H.264 decoder and encoder on the streams in `streams/`, so that a
# build made with `-Cprofile-generate` writes the profile a release build is
# optimised from. `scripts/pgo.py` builds and runs it; run by hand it
# decodes and encodes the same streams and prints what it did.
#
# It depends only on `cutlass-h264` and what that depends on, so those
# crates build here exactly as they do in the desktop app, and the profile's
# function names match the app's.
[package]
name = "cutlass-h264-pgo"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
description = "Trains the H.264 codec's profile for a profile-guided build."

[dependencies]
cutlass-decode = { path = "../../crates/decode", version = "0.1.0" }
cutlass-encode = { path = "../../crates/encode", version = "0.1.0" }
cutlass-h264 = { path = "../../crates/codecs/h264", version = "0.1.0" }

[lints]
workspace = true
