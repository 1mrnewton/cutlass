# Decodes, demuxes or encodes with the Rust codecs and containers alone, so
# the run can be timed against another tool given the same input:
#
#     cargo run --release -p media-bench -- decode picture clip.mp4
#
# `scripts/bench_media.py` makes the files, checks the output, and times
# this tool and ffmpeg the same way.
[package]
name = "media-bench"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
description = "Runs the Rust codecs and containers on a file, for timing against another tool."

[dependencies]
cutlass-engine = { path = "../../crates/engine", version = "0.1.0" }
cutlass-codec = { path = "../../crates/codec", version = "0.1.0" }
cutlass-container = { path = "../../crates/container", version = "0.1.0" }
cutlass-decode = { path = "../../crates/decode", version = "0.1.0" }
