# The iPhone app that runs ml-bench. Generate the Xcode project with:
#     xcodegen --spec ios/project.yml
# Build the Rust library first:
#     cargo build --release --target aarch64-apple-ios --features ios --lib
name: MLBench
options:
  bundleIdPrefix: dev.cutlass
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    DEVELOPMENT_TEAM: FR82ZG29F6
    CODE_SIGN_STYLE: Automatic
targets:
  MLBench:
    type: application
    platform: iOS
    sources:
      - MLBench
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.cutlass.mlbench
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        SWIFT_OBJC_BRIDGING_HEADER: MLBench/bridge.h
        LIBRARY_SEARCH_PATHS: $(PROJECT_DIR)/../target/aarch64-apple-ios/release
        OTHER_LDFLAGS: -lml_bench -framework Metal -framework QuartzCore -framework CoreGraphics -framework Foundation
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    postBuildScripts:
      - name: Copy models
        script: |
          dest="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH"
          for f in mobile_sam-tiny-vitt reference_landscape reference_portrait; do
            cp "$PROJECT_DIR/../models/$f.safetensors" "$dest/"
          done
